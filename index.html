<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Quiz Room</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="site-frame">
    <section id="login-stage" aria-label="Google login">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <span>Quiz Room</span>
      </div>
      <h1>Your little learning corner.</h1>
      <p class="description">One place to practice, learn, and grow.</p>
      <button id="google-login" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        <span>Continue with Google</span>
      </button>
      <p id="login-status" role="status" aria-live="polite" hidden></p>
    </section>
    <div id="main-page" hidden>
      <section id="menu-stage" class="stage" aria-label="Main menu">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">Q</span>
            <span>Quiz Room</span>
          </div>
          <nav class="menu-buttons" aria-label="Pages">
            <button id="menu-home" type="button" class="is-active" aria-current="page">Home</button>
            <button id="menu-quiz" type="button">Quiz</button>
            <button type="button" hidden>Note</button>
            <button type="button" hidden>Profile</button>
            <button id="logout" type="button">Log out</button>
          </nav>
      </section>
      <section id="navigation-stage" class="stage" aria-label="Navigation">
          <div class="menu-buttons">
            <span id="quiz-step-label" class="brand"></span>
            <nav id="quiz-step-actions" class="menu-buttons" aria-label="Quiz choices"></nav>
          </div>
          <nav id="quiz-step-back" class="menu-buttons" aria-label="Back navigation"></nav>
      </section>
      <section id="question-stage" class="stage" aria-label="Content">
          <div id="quiz-toolbar" hidden>
            <span id="quiz-toolbar-name" class="math-quiz-title">Times Tables</span>
            <nav id="quiz-type-actions" class="menu-buttons" aria-label="Quiz types" hidden></nav>
            <span class="quiz-advance-reserve" aria-hidden="true">Retry save</span>
            <div id="quiz-toolbar-middle">
              <span id="quiz-count">0 / 10</span>
              <span id="quiz-progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
                <span id="quiz-progress-fill"></span>
              </span>
              <span id="quiz-clock" role="timer">30:00</span>
            </div>
            <nav id="quiz-toolbar-actions" class="menu-buttons" aria-label="Quiz actions">
              <span id="quiz-advance-slot">
                <span class="quiz-advance-reserve" aria-hidden="true">Retry save</span>
                <button id="quiz-next" type="button" hidden disabled>Next</button>
                <button id="quiz-finish" type="button" hidden>Finish</button>
              </span>
              <button id="quiz-exit" type="button">Exit</button>
            </nav>
          </div>
          <div id="quiz-content"></div>
      </section>
    </div>
  </main>
</body>
</html>
