/* Comfortable spacing between highlight heading, date, progress and statistics. */
.highlights h2{margin-bottom:20px}
.highlights-date{margin-bottom:0}
.highlights-gauge{margin-top:42px;margin-bottom:44px}
/* Animated score progress: the score label remains visible at the far right. */
.highlights-gauge{max-width:520px;margin:42px auto 44px}
.highlights-progress{position:relative;height:38px;border-radius:999px;background:#e7eaf1;overflow:hidden;box-shadow:inset 0 1px 4px #29335f20}
.highlights-progress-fill{position:absolute;inset:0 auto 0 0;width:var(--progress);border-radius:inherit;animation:highlights-fill 1.25s cubic-bezier(.22,.8,.25,1) both}
.highlights-progress-fill.high{background:#35cfa0}
.highlights-progress-fill.medium{background:#ffc349}
.highlights-progress-fill.low{background:#ef8a79}
.highlights-progress-percent{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;font-size:16px;color:#29335f;text-shadow:0 1px 2px #ffffffb0;z-index:1;font-variant-numeric:tabular-nums}
@keyframes highlights-fill{from{width:0}to{width:var(--progress)}}

/* Highlight section spacing */

const SCORE_GITHUB_REPO='dezinerj82/Quiz-room';
let remoteScoreReports=[],scoreReportsPromise=null;
function activeStudentName(){return ($('studentName').value||'').trim()}
function scoreGroup(chapter){
 const c=String(chapter||'').replace(/^Exercise\s+/i,'').replace(/\s+\d+$/,'').trim();
 if(/^(add|subtract|multiply|divide|addition|subtraction|multiplication|division)$/i.test(c))return 'Four Basic Arithmetic Operations';
 return c||'Other';
}
function scoreBand(p){return p>=70?'high':p>=50?'medium':'low'}
function parseScoreReport(txt){
 const lines=txt.split(/\r?\n/);
 const field=k=>{const line=lines.find(line=>line.startsWith(k+':'));return line?line.slice(k.length+1).trim():''};
 const name=field('Name'),subject=field('Subject'),chapter=field('Chapter');
 if(!name||!subject||!chapter)return null;
 const attempts=[];
 for(const line of lines){if(!line.startsWith('Score:'))continue;const m=line.match(/(\d+) out of (\d+)/);if(m&&Number(m[2])>0)attempts.push({score:Number(m[1]),total:Number(m[2])})}
 return {name,subject,chapter,attempts};
}
async function loadRemoteScoreReports(){
 if(remoteScoreReports.length)return;
 if(scoreReportsPromise)return scoreReportsPromise;
 scoreReportsPromise=(async()=>{
  try{
   const res=await fetch('https://api.github.com/repos/'+SCORE_GITHUB_REPO+'/contents/score');
   if(!res.ok)throw Error('Score folder unavailable');
   const files=await res.json();
   if(!Array.isArray(files))return;
   const reports=[];
   for(const f of files.filter(f=>f.type==='file'&&f.name.endsWith('.txt')).slice(0,500)){
    try{const r=await fetch(f.download_url);if(r.ok){const report=parseScoreReport(await r.text());if(report)reports.push(report)}}catch(e){}
   }
   remoteScoreReports=reports;
  }catch(e){console.warn('Score reports unavailable',e)}
 })();
 return scoreReportsPromise;
}
function subjectScoreData(){
 const name=activeStudentName().toLowerCase();
 if(!name)return [];
 const combined=new Map();
 const add=(entry,remote)=>{
  if(!entry||entry.name.trim().toLowerCase()!==name||entry.subject.toLowerCase()!==subject.toLowerCase())return;
  const key=entry.name.toLowerCase()+'|'+entry.subject.toLowerCase()+'|'+entry.chapter.toLowerCase();
  if(!combined.has(key)||remote)combined.set(key,entry);
 };
 Object.values(loadScoreHistory()).forEach(e=>add(e,false));
 remoteScoreReports.forEach(e=>add(e,true));
 return [...combined.values()];
}
function highlightDate(){

 const suffix=day%100>=11&&day%100<=13?'th':day%10===1?'st':day%10===2?'nd':day%10===3?'rd':'th';
 return p.month+' '+day+suffix+' '+p.year;
}

function advance(){if(!answered&&!bookmarks.has(index))return;if(bookmarkView){resumeQuiz();return}index++;resumeIndex=index;if(index>=questions.length){const pending=questions.findIndex((q,i)=>!answerSnapshots[i]);if(pending>=0){index=pending;resumeIndex=index;render();return}finish();return}render()}
function toggleBookmark(checked){if(checked)bookmarks.add(index);else bookmarks.delete(index);$('nextButton').disabled=!(answered||bookmarks.has(index));updateBookmarkUI()}
function updateBookmarkUI(){$('bookmarkCheck').checked=bookmarks.has(index);$('bookmarkListButton').classList.toggle('hidden',!bookmarks.size);$('resumeButton').classList.toggle('hidden',!bookmarkView);$('bookmarkList').innerHTML=[...bookmarks].sort((a,b)=>a-b).map(i=>'<button onclick="goBookmark('+i+')">Question '+(i+1)+(answerSnapshots[i]?' ✓':' •')+'</button>').join('');if(!bookmarks.size)$('bookmarkList').classList.add('hidden')}
let bookmarkCloseTimer=null;

function goBookmark(i){if(!bookmarks.has(i))return;if(!bookmarkView)resumeIndex=index;bookmarkView=i<resumeIndex;index=i;$('bookmarkList').classList.add('hidden');render()}

function restart(){start(version)}
const SCORE_STORAGE_KEY='isaac_quiz_scores_from_20261029_v1';
let scoreAttemptRecorded=false,latestScoreKey='';
function cleanScorePart(value){return String(value||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,28)||'unknown'}
function saveStudentName(){const input=$('studentName');input.value=input.value.trim().slice(0,40);try{localStorage.setItem('isaac_quiz_student_name',input.value)}catch(e){}}
function loadScoreHistory(){try{const data=JSON.parse(localStorage.getItem(SCORE_STORAGE_KEY)||'{}');return data&&typeof data==='object'&&!Array.isArray(data)?data:{}}catch(e){return {}}}
function scoreDateParts(date){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return {day:p.year+p.month+p.day,time:p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute+':'+p.second+' MYT'}}
function recordScoreAttempt(){
 if(scoreAttemptRecorded||!questions.length)return;
 scoreAttemptRecorded=true;
 const name=activeStudentName();
 if(!name)return; // Guest quizzes show results but never persist scores.
 saveStudentName();
 const chapter=activeExerciseTopic?'Exercise '+activeExerciseTopic:'Exam Revision '+version;
 const now=scoreDateParts(new Date());
 const filename=cleanScorePart(name)+'_'+cleanScorePart(subject)+'_'+cleanScorePart(chapter)+'_'+now.day+'.txt';
 const history=loadScoreHistory(),attempts=Array.isArray(history[filename]?.attempts)?history[filename].attempts:[];
 const incorrect=[...new Set(wrongQuestions.map(q=>q.number))].sort((a,b)=>a-b);
 const unanswered=questions.map((q,i)=>i+1).filter(n=>!answerSnapshots[n-1]);
 history[filename]={name,subject,chapter,attempts:[...attempts,{time:now.time,score,total:questions.length,incorrect,unanswered,version:chapter}]};
 latestScoreKey=filename;
 try{localStorage.setItem(SCORE_STORAGE_KEY,JSON.stringify(history))}catch(e){console.warn('Score history could not be saved',e)}
}
function downloadScore(){
 if(!scoreAttemptRecorded)recordScoreAttempt();
 const entry=activeStudentName()?loadScoreHistory()[latestScoreKey]:null;
 if(!entry){alert(activeStudentName()?'Score history unavailable. Please allow browser storage and try again.':'Enter your name on the home page to save and download score reports.');return}
 const lines=['Name: '+entry.name,'Subject: '+entry.subject,'Chapter: '+entry.chapter,''];
 entry.attempts.forEach((attempt,i)=>{lines.push('Attempt '+(i+1),'Completed: '+attempt.time,'Quiz version: '+attempt.version,'Score: '+Math.round(attempt.score/attempt.total*100)+'% ('+attempt.score+' out of '+attempt.total+')','Incorrect questions: '+(attempt.incorrect.length?attempt.incorrect.join(', '):'None'));if(attempt.unanswered.length)lines.push('Unanswered questions: '+attempt.unanswered.join(', '));lines.push('')});
 const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=latestScoreKey;link.click();setTimeout(()=>URL.revokeObjectURL(url),500);
}
$('subjects').innerHTML=names.map(n=>'<button class="tile" onclick="choose(\''+n+'\')">'+n+'</button>').join('');document.querySelector('#home .rainbow').innerHTML=rainbow('Quiz time');try{$('studentName').value=localStorage.getItem('isaac_quiz_student_name')||''}catch(e){}let initial=new URLSearchParams(location.search).get('subject');if(initial){let match=names.find(n=>n.toLowerCase()===initial.toLowerCase());if(match)choose(match)}
